[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gpap"
version = "0.1.0"
description = "GPU-parallel BCP over independent assumption sets, and GPU CircuitSAT solution sampling"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Yogev Shalmon" }]
keywords = ["SAT", "sampling", "GPU", "BCP", "CircuitSAT", "triton", "pytorch", "cuda"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Environment :: GPU :: NVIDIA CUDA",
]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    # `.dev0` in the specifier is LOAD-BEARING, not sloppiness: python-sat ships only
    # pre-releases for recent CPython (1.9.dev7 is the sole cp312 wheel), and PEP 440 says pip
    # ignores pre-releases unless the specifier itself mentions one. With a plain `>=0.1.8`,
    # `pip install -e .` dies with "No matching distribution found for python-sat" on any clean
    # Python 3.12 box — it only ever worked here because this venv already had 1.9.dev2. Found
    # on a fresh Colab VM 2026-08-03; it would have hit the HPC cluster identically.
    "python-sat>=0.1.8.dev0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
cuda = ["triton>=3.0"]        # the fused trajectory kernels (ships with torch on Linux/Colab)
eval = ["matplotlib>=3.7"]    # eval/ plots
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
gpap = "gpap.cli:main"

[tool.setuptools.packages.find]
include = ["gpap*"]

# The engine core (libgpap) is a compiled artifact, built by scripts/build_core.sh. When it is
# installed into the package (build_core.sh --install), ship it with the wheel; the ctypes
# binding also finds a repo-local build/ automatically.
[tool.setuptools.package-data]
gpap = ["lib/libgpap.so*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires CUDA + a built libgpap (skipped without either)",
    "slow: slow deep-unroll case (c25)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["archive", "notebooks", ".cmsgen"]

[tool.ruff.lint]
# Keep the net light: real errors + unused-import hygiene (F, E9), NOT style churn on this
# math-dense code — the compact `a; b` statements and `x == True` tensor checks are deliberate.
select = ["E4", "E9", "F"]
ignore = ["E741"]   # `l` is the conventional literal variable throughout the BCP code

[tool.ruff.lint.per-file-ignores]
# Repo-root drivers bootstrap sys.path before importing gpap (Colab / PYTHONPATH-less runs).
"eval/*" = ["E402"]
"scripts/*" = ["E402"]
