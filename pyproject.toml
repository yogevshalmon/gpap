[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gpap"
version = "0.1.0"
description = "GPU-parallel (partial) assignment propagation: BCP over hundreds of thousands of independent partial assignments in one kernel launch, and the GPU solution sampler built on it"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Yogev Shalmon" }]
keywords = ["SAT", "sampling", "GPU", "BCP", "CircuitSAT", "triton", "pytorch", "cuda"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Environment :: GPU :: NVIDIA CUDA",
]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Build-time only: AOT-compiles the kernels into libgpap (>=3.2 for tl.gather).
build = ["triton>=3.2"]
# python-sat is for eval/ and tests, not the library. `.dev0` lets pip pick its pre-release
# wheels on recent CPython; the upper bound pins the eval's UNSAT verdicts (rival_common.py).
solver = ["python-sat>=0.1.8.dev0,<1.10"]
eval = ["matplotlib>=3.7", "python-sat>=0.1.8.dev0,<1.10"]
dev = ["pytest>=7.4", "ruff>=0.4", "python-sat>=0.1.8.dev0,<1.10"]

[project.scripts]
gpap = "gpap.cli:main"

[project.urls]
Homepage = "https://github.com/yogevshalmon/gpap"
Documentation = "https://github.com/yogevshalmon/gpap/blob/main/docs/README.md"
Repository = "https://github.com/yogevshalmon/gpap"
Issues = "https://github.com/yogevshalmon/gpap/issues"

[tool.setuptools.packages.find]
include = ["gpap*"]

# libgpap, when `scripts/build_core.sh --install` copies it into the package.
[tool.setuptools.package-data]
gpap = ["lib/libgpap.so*"]

[tool.pytest.ini_options]
# The default run: the engine, the applications on it, and the repo itself. The paper's
# experiment layer is tested apart: `pytest tests/experiments`.
testpaths = ["tests/engine", "tests/sampling", "tests/mining", "tests/circuits", "tests/cli",
             "tests/repo"]
pythonpath = ["."]   # `eval` and `tests` import from the repo root in any import mode
markers = [
    "gpu: requires CUDA + a built libgpap (skipped without either)",
    "slow: slow deep-unroll case (c25)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".gpap"]

[tool.ruff.lint]
# Errors and unused imports only, no style rules.
select = ["E4", "E9", "F"]
ignore = ["E741"]   # `l` is the literal variable throughout

[tool.ruff.lint.per-file-ignores]
# These scripts set sys.path before importing gpap.
"eval/*" = ["E402"]
"scripts/*" = ["E402"]
