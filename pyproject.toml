[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gpap"
version = "0.1.0"
description = "GPU-parallel BCP over independent assumption sets, and GPU CircuitSAT solution sampling"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Yogev Shalmon" }]
keywords = ["SAT", "sampling", "GPU", "BCP", "CircuitSAT", "triton", "pytorch", "cuda"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Environment :: GPU :: NVIDIA CUDA",
]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Triton compiles the GPU kernels AHEAD OF TIME into libgpap (scripts/build_core.sh); the
# shipped library links libcuda alone, so nothing here is needed to RUN the engine. It ships
# with torch on Linux/Colab, so this extra is usually already satisfied.
build = ["triton>=3.2"]       # rebuilding cpp/kernels/*.py into cubins (>=3.2: tl.gather)
# `--uniformity exact` enumerates the projected solution space with a SAT solver; everything
# else parses and runs without python-sat (the DIMACS parser is the core's — gpap.engine
# .read_dimacs). The `.dev0` in the specifier is LOAD-BEARING: python-sat publishes only
# pre-releases for recent CPython, and PEP 440 makes pip ignore pre-releases unless the
# specifier itself names one — a plain `>=0.1.8` fails to resolve on a clean recent Python.
solver = ["python-sat>=0.1.8.dev0"]
eval = ["matplotlib>=3.7", "python-sat>=0.1.8.dev0"]    # eval/ plots + rival/oracle harnesses
dev = ["pytest>=7.4", "ruff>=0.4", "python-sat>=0.1.8.dev0"]

[project.scripts]
gpap = "gpap.cli:main"

[tool.setuptools.packages.find]
include = ["gpap*"]

# The engine core (libgpap) is a compiled artifact, built by scripts/build_core.sh. When it is
# installed into the package (build_core.sh --install), ship it with the wheel; the ctypes
# binding also finds a repo-local build/ automatically.
[tool.setuptools.package-data]
gpap = ["lib/libgpap.so*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires CUDA + a built libgpap (skipped without either)",
    "slow: slow deep-unroll case (c25)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks", ".gpap"]

[tool.ruff.lint]
# Keep the net light: real errors + unused-import hygiene (F, E9), NOT style churn on this
# math-dense code — the compact `a; b` statements and `x == True` tensor checks are deliberate.
select = ["E4", "E9", "F"]
ignore = ["E741"]   # `l` is the conventional literal variable throughout the BCP code

[tool.ruff.lint.per-file-ignores]
# Repo-root drivers bootstrap sys.path before importing gpap (Colab / PYTHONPATH-less runs).
"eval/*" = ["E402"]
"scripts/*" = ["E402"]
