name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with the Python classifiers in pyproject.toml.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (CPU torch + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check gpap tests scripts eval cpp examples docs/assets/tools
      - name: CPU smoke suite (GPU tests auto-skip off-CUDA)
        run: pytest -m "not gpu and not slow" -q
      - name: Eval-layer tests (not in the default run)
        run: pytest tests/experiments -m "not gpu and not slow" -q

  build-core:
    # The engine core builds WITHOUT a GPU, WITHOUT the CUDA toolkit and WITHOUT the NVIDIA
    # driver: triton cross-compiles the kernels for a named arch, cuda.h comes from the triton
    # wheel, and libgpap opens libcuda at run time. This job is the proof that a new user can run
    # scripts/build_core.sh on a clean machine, and then the one job that EXECUTES kernels: the
    # OpenCL backend's, on PoCL's CPU driver, on a runner with no NVIDIA driver at all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install triton (the kernel compiler; build-time only)
        # triton ONLY — deliberately no torch. The AOT path must not need it: triton's NVIDIA
        # backend reports itself inactive unless torch is installed AND a GPU is present, so a
        # runner could never satisfy it anyway. This job is what keeps that true.
        # The version comes from the artifact's lock: a newer triton is where a silent
        # miscompile would come from, so CI builds with the one the published rows were built with.
        run: |
          python -m pip install --upgrade pip
          pip install -c eval/artifact/requirements-artifact.txt triton numpy
      - name: AOT-compile the kernels for sm_80 (no GPU needed)
        run: python cpp/tools/build_kernels.py --arch 80
      - name: Build libgpap
        # -DPython3_EXECUTABLE: with no CUDA toolkit, CMakeLists gets cuda.h out of the triton
        # wheel by asking a python for it. Pin the one we installed triton into rather than
        # letting find_package(Python3) choose.
        run: |
          cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release \
                -DPython3_EXECUTABLE="$(which python)"
          cmake --build build -j
      - name: Check the artifacts exist
        # Keep this list in sync with cpp/CMakeLists.txt's add_executable targets.
        shell: bash
        run: |
          test -f build/libgpap.so
          test -x build/gpap_c_api
          test -x build/gpap_sample
          test -x build/gpap_assumptions
          test -x build/gpap_probe
          if readelf -d build/libgpap.so | grep -qi libcuda; then   # opened at run time instead
            echo "libgpap links libcuda: it would not load without the NVIDIA driver"; exit 1
          fi
          echo "libgpap and every example build from a clean checkout"
      - name: Install CPU torch, the dev extras and an OpenCL runtime on the CPU (PoCL)
        # After the build, so the steps above still prove it needs no torch.
        shell: bash        # pipefail: a failing `env` must not hand GITHUB_ENV nothing
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
          scripts/setup_opencl.sh cpu
          scripts/setup_opencl.sh env | sed -e 's/^export //' -e 's/"//g' >> "$GITHUB_ENV"
      - name: The kernel table, read off the cubins just built
        # The host job has no generated table, so these tests skip there. Here they check that no
        # two keys share a cubin and that every WAVE kernel keeps relaxed atomics and its two
        # barriers; a skip (no cuobjdump in this triton) fails the step.
        shell: bash
        run: |
          pytest tests/engine/test_kernel_table.py -m "not gpu" -q -rs | tee kernel_table.log
          if grep -q SKIPPED kernel_table.log; then echo "a kernel-table test skipped"; exit 1; fi
      - name: The OpenCL backend opens a device
        # A test with no device skips, so without this step a broken runtime would pass green.
        env:
          GPAP_BACKEND: opencl
        run: |
          python -c "from gpap.engine import _core; e = _core.Engine(_core.Formula.from_clauses(2, [[1, 2]])); print(e.backend, 'on', e.device_name)"
      - name: The engine on the OpenCL backend, with no NVIDIA driver
        # Every test that needs only an engine (`engine`), the backend's own (`opencl`) and the
        # library's (`core`). -rs prints the skips: the ones that need CUDA tensors.
        env:
          GPAP_BACKEND: opencl
        run: pytest -m "(engine or opencl or core) and not slow" -q -rs
